<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>REDLINE</title><style>:root{--r:#ff3545;--b:#09090b;--s:#141417;--m:#808086;--l:#29292f;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#f5f5f5;font:15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.app{max-width:510px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 25px)}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}header,.end{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:.22em;font-weight:800;color:var(--r)}.version,.status,.note,.end{color:var(--m)}.reload{width:42px;height:42px;border:1px solid var(--l);background:var(--s);border-radius:14px;font-size:21px}.status{text-align:center;margin:20px 0 4px;font-size:11px;letter-spacing:.14em}.status b{color:#f5f5f5}.dial{width:min(80vw,345px);aspect-ratio:1;margin:auto;display:grid;place-items:center;position:relative}.dial svg{position:absolute;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.track{fill:none;stroke:#242429;stroke-width:7}.ring{fill:none;stroke:var(--r);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 8px #ff354566)}.dot{fill:#141417;stroke:#595960;stroke-width:2}.dot.done{fill:var(--r);stroke:var(--r)}.dot.next{stroke:var(--r);filter:drop-shadow(0 0 5px var(--r))}.center{z-index:1;width:71%;aspect-ratio:1;border:1px solid #26262b;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#1c1c21,#101012 67%);box-shadow:inset 0 0 28px #0008}.now{font-size:12px;color:var(--m);margin-bottom:8px}.label{font-size:10px;letter-spacing:.15em;color:var(--m)}.time{font-size:clamp(51px,14vw,72px);font-weight:750;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.over{color:var(--r)}.note{height:18px;margin-top:7px;font-size:12px}.end{max-width:330px;margin:0 auto 20px;font-size:12px}.end b{color:#f5f5f5;font-size:15px;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:9px}.act{height:76px;border:1px solid var(--l);border-radius:19px;background:var(--s);font-weight:700;font-size:11px}.act.main{background:linear-gradient(145deg,#f33d4b,#bd2031);border-color:#ff6670;font-size:13px}.act.hot{color:#ff7b85}.ttl{margin:27px 0 11px;color:var(--m);font-size:10px;letter-spacing:.16em}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.preset{height:54px;border:1px solid var(--l);border-radius:16px;background:#121215;font-weight:700}.help{text-align:center;color:var(--m);font-size:12px;line-height:1.5;margin:20px auto;max-width:365px}.modal{display:none;position:fixed;inset:0;padding:20px;background:#09090bea;align-items:center;justify-content:center;backdrop-filter:blur(14px)}.modal.show{display:flex}.sheet{width:min(100%,390px);background:#151518;border:1px solid #37373e;border-radius:28px;padding:26px;text-align:center}.sheet h2{margin:0}.big{font-size:67px;font-weight:750;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.sheet p{color:var(--m);font-size:13px}.sheet div:last-child{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sheet button{height:58px;border:1px solid var(--l);border-radius:17px;background:#27272c;font-weight:700}.sheet .finish{background:var(--r);border-color:#ff6871}.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);background:#303036;padding:11px 15px;border-radius:13px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}@media(max-height:700px){.dial{width:min(66vw,285px)}.ttl{margin-top:16px}}</style><main class="app"><header><div class="brand">REDLINE <span class="version">/ 3.2</span></div><button id="reload" class="reload" aria-label="Обновить приложение">↻</button></header><div id="status" class="status"></div><div class="dial"><svg viewBox="0 0 300 300"><circle class="track" cx="150" cy="150" r="136"/><circle id="ring" class="ring" cx="150" cy="150" r="136"/><g id="marks"/></svg><div class="center"><div id="now" class="now"></div><div id="label" class="label"></div><div id="time" class="time"></div><div id="note" class="note"></div></div></div><div class="end"><span>ДО КОНЦА ДНЯ</span><b id="end"></b></div><div class="actions"><button id="pause" class="act main">ПЕРЕРЫВ</button><button id="workout" class="act hot">ЗАРЯДКА</button><button id="walk" class="act">ОТОЙТИ</button></div><div class="ttl">БЫСТРЫЙ ТАЙМЕР</div><div id="presets" class="presets"><button class="preset" data-m="3">03:00</button><button class="preset" data-m="5">05:00</button><button class="preset" data-m="10">10:00</button><button class="preset" data-m="15">15:00</button></div><p id="help" class="help"></p></main><div id="modal" class="modal"><div class="sheet"><h2 id="title"></h2><p id="text"></p><div id="modalTime" class="big"></div><div><button id="cancel">Отменить</button><button id="finish" class="finish">Завершить</button></div></div></div><div id="toast" class="toast"></div><script>const $=x=>document.getElementById(x),K='redline_v3',D={start:'07:00',end:'14:00',interval:55,duration:5,history:[],anchor:null,active:null,quick:null};let bad=0,r={};try{r=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){bad=1}let s=Object.assign({},D,r);if(!Array.isArray(s.history))s.history=[];const T={break:'Перерыв',workout:'Зарядка',walk:'Отойти'};function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){toast('Не удалось сохранить данные')}}function day(d=new Date){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function at(n,h){let p=h.split(':').map(Number),d=new Date(n);d.setHours(p[0],p[1],0,0);return+d}function f(ms){let z=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(z/60)).padStart(2,'0')+':'+String(z%60).padStart(2,'0')}function clk(n){return new Date(n).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false})}function sch(){let n=Date.now(),a=at(n,s.start),b=at(n,s.end),q=s.anchor&&s.anchor.day===day()?s.anchor.ts:a;return{n,a,b,q:Math.max(a,q),next:Math.max(a,q)+Number(s.interval)*60000}}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function start(t){if(s.active||s.quick)return toast('Сначала заверши текущий таймер');let n=Date.now();s.active={start:n,end:n+Number(s.duration)*60000,type:t};save();render()}function quick(m){if(s.active||s.quick)return toast('Сначала заверши текущий таймер');let n=Date.now();s.quick={start:n,end:n+m*60000,m};save();render()}function stop(ok){let n=Date.now();if(s.active){let a=s.active;if(ok){s.history.push({day:day(new Date(a.start)),start:a.start,end:n,duration:Math.max(0,n-a.start),type:a.type,completed:true});let x=sch();if(a.start>=x.a&&a.start<x.b)s.anchor={day:day(),ts:n}}s.active=null;if(ok)toast('Перерыв сохранён')}else if(s.quick){s.quick=null;if(ok)toast('Таймер завершён')}save();render()}function dot(t,a,b,c){let p=Math.max(0,Math.min(1,(t-a)/(b-a))),x=150+136*Math.cos(p*6.283-Math.PI/2),y=150+136*Math.sin(p*6.283-Math.PI/2);return '<circle class="dot '+c+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5"/>'}function render(){let x=sch(),a=x.a,b=x.b,n=x.n,run=s.active||s.quick,inDay=n>=a&&n<b,p=Math.max(0,Math.min(1,(n-a)/(b-a))),c=2*Math.PI*136;$('ring').style.strokeDasharray=c;$('ring').style.strokeDashoffset=c*(1-p);$('now').textContent=clk(n);$('status').innerHTML='<b>'+(n<a?'ДО НАЧАЛА':n>=b?'ДЕНЬ ЗАВЕРШЁН':'РАБОЧИЙ ДЕНЬ')+'</b> · '+s.start+'–'+s.end;let mk='';for(let t=x.q+Number(s.interval)*60000;t<b;t+=Number(s.interval)*60000)mk+=dot(t,a,b,t===x.next&&!run?'next':'');s.history.filter(e=>e.day===day()&&e.completed&&e.start>=a&&e.start<=b).forEach(e=>mk+=dot(e.start,a,b,'done'));$('marks').innerHTML=mk;let l,m,no;if(s.active){l=T[s.active.type].toUpperCase();m=s.active.end-n;no='Идёт пауза'}else if(s.quick){l='БЫСТРЫЙ ТАЙМЕР';m=s.quick.end-n;no=s.quick.m+' мин'}else if(n<a){l='ДО НАЧАЛА';m=a-n;no='Следующий рабочий день'}else if(n>=b){l='ДО НАЧАЛА';m=a+86400000-n;no='Следующий рабочий день'}else if(x.next>=b){l='ДО КОНЦА';m=b-n;no='Пауза сегодня не планируется'}else{l=x.next<=n?'ПОРА ОТДОХНУТЬ':'ДО ПЕРЕРЫВА';m=Math.max(0,x.next-n);no=x.next<=n?'Начни, когда удобно':'Следующая пауза '+clk(x.next)}$('label').textContent=l;$('time').textContent=f(m);$('time').classList.toggle('over',!run&&inDay&&x.next<=n);$('note').textContent=no;$('end').textContent=n<a?f(a-n):n<b?f(b-n):'ЗАВЕРШЁН';$('modal').classList.toggle('show',!!run);if(run){$('title').textContent=s.active?T[s.active.type]:'Быстрый таймер';$('text').textContent=s.active?'После завершения рабочего перерыва начнётся новый интервал.':'Работает независимо от расписания.';$('modalTime').textContent=f((s.active?s.active.end:s.quick.end)-n)}$('help').textContent=bad?'Данные не удалось прочитать. Они не удалены: проверьте хранилище браузера.':run?'Таймер сохранится при обновлении страницы.':'Перерывы и быстрые таймеры доступны в любое время. Действия вне рабочего дня не меняют расписание.'}$('pause').onclick=()=>start('break');$('workout').onclick=()=>start('workout');$('walk').onclick=()=>start('walk');$('presets').querySelectorAll('button').forEach(b=>b.onclick=()=>quick(+b.dataset.m));$('finish').onclick=()=>stop(1);$('cancel').onclick=()=>stop(0);$('reload').onclick=()=>{toast('Загружаю актуальную версию…');setTimeout(()=>location.replace(location.pathname+'?refresh='+Date.now()),120)};document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();setInterval(render,1000);</script>
