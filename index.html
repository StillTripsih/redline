<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>REDLINE</title><link rel="stylesheet" href="./style.css?v=4.0.0"></head>
<body><main id="main-page" class="app"><header class="home-header"><button id="settings" class="icon-button" aria-label="Настройки приложения"></button><button id="stats" class="icon-button" aria-label="Статистика"></button></header><div class="day-hours-row"><time id="today" class="calendar-date"></time><button id="hours" class="hours" aria-label="Настроить рабочие часы"></button></div>
<div class="dial-stage"><div class="single-dial" id="single-dial"><svg id="main-dial-svg" viewBox="8 8 344 344" aria-label="Спираль дня от 0 до 24 часов"></svg><div class="single-center"><div id="session-icon" class="session-icon" aria-hidden="true"></div><div id="now" class="now"></div><div id="label" class="label"></div><div class="live-time"><span id="time" class="time"></span><small id="seconds"></small></div><div id="note" class="note"></div><div id="lap-readout" class="lap-readout"></div><svg id="session-progress" class="session-progress" viewBox="0 0 100 100" aria-hidden="true" hidden><circle class="session-track" cx="50" cy="50" r="47"/><circle class="session-fill" cx="50" cy="50" r="47" pathLength="100"/></svg></div></div></div><div class="timer-strip" id="timer-strip" hidden><button id="strip-expand" aria-label="Развернуть таймер"><span id="strip-time"></span></button><button id="strip-pause" aria-label="Пауза таймера">Ⅱ</button><button id="strip-cancel" aria-label="Отменить таймер">×</button></div><div id="quick-tools" class="quick-tools"><button id="reopen-session" class="minimized-timer" aria-label="Развернуть текущий отсчёт" hidden></button><button id="custom-timer" class="icon-button" aria-label="Настроить таймер"></button><button id="custom-stopwatch" class="icon-button" aria-label="Настроить секундомер"></button></div><div class="home-controls"><div id="timer-controls" class="timer-controls" hidden><button id="stopwatch-pause" class="round-control" hidden aria-label="Пауза"><span>Ⅱ</span><small>Пауза</small></button><button id="stopwatch-reset" class="round-control" hidden aria-label="Сбросить секундомер"><span>↺</span><small>Сброс</small></button><button id="stopwatch-lap" class="round-control" hidden aria-label="Отметить круг"><span>⚑</span><small>Круг</small></button><button id="cancel" class="round-control" aria-label="Отменить таймер"><span>×</span></button><button id="finish" class="round-control" aria-label="Завершить таймер"><span>✓</span></button></div>
<div class="actions"><button id="pause" class="round-action" aria-label="Перерыв" title="Перерыв"></button><button id="workout" class="round-action" aria-label="Зарядка" title="Зарядка"></button><button id="walk" class="round-action" aria-label="Отойти" title="Отойти"></button></div>
</div></main>
<section id="sound-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Звуки</h1><button id="save-sounds" class="icon-button" aria-label="Сохранить звуки">✓</button></header><div id="sound-form" class="settings-body"></div></section>
<section id="settings-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Настройки</h1><button id="save-settings" class="icon-button" aria-label="Сохранить настройки">✓</button></header><div class="settings-footer settings-top"><span class="brand">REDLINE / 4.0</span><button id="reload" class="icon-button" aria-label="Обновить приложение">↻</button></div><div class="settings-sound-row"><button id="sound-settings" class="sound-settings-link">Звуки</button><button id="sound" class="icon-button" aria-label="Настройки звуков"></button></div><div id="settings-form" class="settings-body"></div></section>
<section id="ai-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>AI-помощник</h1><span></span></header><div id="ai-form"></div><div id="ai-result" aria-live="polite"></div></section><section id="stats-page" class="app stats-page" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Статистика</h1><span class="header-space"></span></header><div class="stats-fixed"><div class="stats-dates"><input id="stats-from" type="date" aria-label="Начало периода"><span>⟶<small id="stats-days"></small></span><input id="stats-to" type="date" aria-label="Конец периода"></div><div id="stats-periods" class="stats-periods"><button data-days="1">1</button><button data-days="7">7</button><button data-days="30">30</button><button data-days="365">365</button><button data-days="all" aria-label="Всё время">∞</button></div><div id="stats-chart" class="stats-chart" tabindex="0" role="group" aria-label="Перетащите график; два пальца меняют масштаб"><svg id="stats-svg" viewBox="0 0 600 180" preserveAspectRatio="none" aria-label="Время пауз по дням" role="img"></svg><div id="stats-axis" class="stats-axis"></div></div><div id="stats-selection" class="stats-selection"></div></div><button id="stats-ai" class="settings-link">AI · Получить совет или изменить настройки</button><div id="stats-list" class="stats-list" tabindex="0" role="region" aria-label="Журнал событий"></div></section><div id="break-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="break-title"><section class="sheet"><div class="sheet-heading"><h2 id="break-title">Перерыв</h2><button class="icon-button close" data-close aria-label="Закрыть">×</button></div><div id="reasons" class="reasons"></div></section></div>
<div id="hours-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="hours-title"><section class="sheet time-sheet"><div class="sheet-heading"><h2 id="hours-title">Рабочие часы</h2><button class="icon-button close" data-close aria-label="Отменить">×</button></div><div class="time-tabs"><button id="start-tab" aria-pressed="true"></button><button id="end-tab" aria-pressed="false"></button></div><div class="wheel-labels"><span>Часы</span><span>Минуты</span></div><div class="time-wheels"><div id="hour-wheel" class="wheel" role="listbox" aria-label="Часы" tabindex="0"></div><span class="colon">:</span><div id="minute-wheel" class="wheel" role="listbox" aria-label="Минуты" tabindex="0"></div></div><button id="save-hours" class="save-hours" aria-label="Сохранить рабочие часы">✓</button></section></div>
<div id="goal-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="goal-title"><section class="sheet goal-sheet"><div class="sheet-heading"><h2 id="goal-title">Таймер</h2><button class="icon-button" data-close aria-label="Отмена">×</button></div><p id="goal-help" class="ai-note"></p><div id="goal-presets" class="goal-presets"></div><div id="goal-selected" class="goal-selected"></div><div class="goal-wheels" id="goal-wheels"><label><svg class="wheel-unit" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div id="goal-hours" class="wheel" tabindex="0" role="listbox" aria-label="Часы"></div></label><label><svg class="wheel-unit" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 3v9l-4 4"/></svg><div id="goal-minutes" class="wheel" tabindex="0" role="listbox" aria-label="Минуты"></div></label><label><svg class="wheel-unit" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 3v9M3 12h2M19 12h2"/></svg><div id="goal-seconds" class="wheel" tabindex="0" role="listbox" aria-label="Секунды"></div></label></div><label id="goal-option" class="setting-row"><span>Сигнал при достижении цели</span><input id="goal-enabled" type="checkbox"></label><div class="goal-footer"><button id="start-goal" class="icon-button bare-check" aria-label="Запустить таймер">✓</button></div></section></div><section id="session-overlay" class="session-overlay" role="dialog" aria-modal="true" aria-label="Текущий отсчёт" hidden><button id="minimize-session" class="icon-button" aria-label="Свернуть отсчёт">⌄</button><div id="session-center-host"></div><div id="session-controls-host"></div></section><script type="module" src="./app.mjs?v=4.0.0"></script></body></html>
