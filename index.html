<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>REDLINE</title><link rel="stylesheet" href="./style.css?v=3.6.0"></head>
<body><main id="main-page" class="app"><header class="home-header"><button id="settings" class="icon-button" aria-label="Настройки приложения"></button><button id="stats" class="icon-button" aria-label="Статистика"></button></header><div class="day-hours-row"><time id="today" class="calendar-date"></time><button id="hours" class="hours" aria-label="Настроить рабочие часы"></button></div>
<div class="single-dial" id="single-dial"><svg id="main-dial-svg" viewBox="0 0 360 360" aria-label="Две половины дня: активное кольцо снаружи"></svg><div class="single-center"><div id="session-icon" class="session-icon" aria-hidden="true"></div><div id="now" class="now"></div><div id="label" class="label"></div><div class="live-time"><span id="time" class="time"></span><small id="seconds"></small></div><div id="note" class="note"></div><div id="session-progress" class="session-progress" hidden><i></i></div></div></div><div id="ring-halves" class="ring-halves"></div><div id="health-legend" class="health-legend"><button data-health="water">💧 Вода</button><button data-health="move">↟ Разминка</button><button data-health="eyes">◉ Глаза</button></div>
<div id="timer-controls" class="timer-controls" hidden><button id="cancel" class="round-control" aria-label="Отменить таймер"><span>×</span><small>Отменить</small></button><button id="finish" class="round-control" aria-label="Завершить таймер"><span>✓</span><small>Завершить</small></button></div>
<div class="actions"><button id="pause" class="round-action" aria-label="Перерыв" title="Перерыв"></button><button id="workout" class="round-action" aria-label="Зарядка" title="Зарядка"></button><button id="walk" class="round-action" aria-label="Отойти" title="Отойти"></button></div>
<div id="presets" class="presets" role="group" aria-label="Быстрый таймер"><button class="preset" data-m="3" aria-label="Таймер на 3 минуты">3<small>мин</small></button><button class="preset" data-m="5" aria-label="Таймер на 5 минут">5<small>мин</small></button><button class="preset" data-m="10" aria-label="Таймер на 10 минут">10<small>мин</small></button><button class="preset" data-m="15" aria-label="Таймер на 15 минут">15<small>мин</small></button></div>
</main>
<section id="sound-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Звуки</h1><button id="save-sounds" class="icon-button" aria-label="Сохранить звуки">✓</button></header><div id="sound-form" class="settings-body"></div></section>
<section id="settings-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Настройки</h1><button id="save-settings" class="icon-button" aria-label="Сохранить настройки">✓</button></header><div class="settings-footer settings-top"><span class="brand">REDLINE / 3.6</span><button id="reload" class="icon-button" aria-label="Обновить приложение">↻</button></div><div class="settings-sound-row"><span>Звуки</span><button id="sound" class="icon-button" aria-label="Настройки звуков"></button></div><div id="settings-form" class="settings-body"></div></section>
<section id="ai-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>AI-помощник</h1><span></span></header><div id="ai-form"></div><div id="ai-result" aria-live="polite"></div></section><section id="stats-page" class="app stats-page" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Статистика</h1><span class="header-space"></span></header><div class="stats-fixed"><div id="stats-total" class="stats-total"></div><div class="stats-dates"><input id="stats-from" type="date" aria-label="Начало периода"><span>⟶<small id="stats-days"></small></span><input id="stats-to" type="date" aria-label="Конец периода"></div><div id="stats-periods" class="stats-periods"><button data-days="1">1</button><button data-days="7">7</button><button data-days="30">30</button><button data-days="365">365</button><button data-days="all" aria-label="Всё время">∞</button></div><div id="stats-chart" class="stats-chart" tabindex="0" role="group" aria-label="Перетащите график; два пальца меняют масштаб"><svg id="stats-svg" viewBox="0 0 600 180" preserveAspectRatio="none" aria-label="Время пауз по дням" role="img"></svg><div id="stats-axis" class="stats-axis"></div></div><div id="stats-selection" class="stats-selection"></div></div><button id="stats-ai" class="settings-link">AI · Получить совет или изменить настройки</button><div id="stats-list" class="stats-list" tabindex="0" role="region" aria-label="Журнал событий"></div></section><div id="break-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="break-title"><section class="sheet"><div class="sheet-heading"><h2 id="break-title">Перерыв</h2><button class="icon-button close" data-close aria-label="Закрыть">×</button></div><div id="reasons" class="reasons"></div></section></div>
<div id="hours-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="hours-title"><section class="sheet time-sheet"><div class="sheet-heading"><h2 id="hours-title">Рабочие часы</h2><button class="icon-button close" data-close aria-label="Отменить">×</button></div><div class="time-tabs"><button id="start-tab" aria-pressed="true"></button><button id="end-tab" aria-pressed="false"></button></div><div class="wheel-labels"><span>Часы</span><span>Минуты</span></div><div class="time-wheels"><div id="hour-wheel" class="wheel" role="listbox" aria-label="Часы" tabindex="0"></div><span class="colon">:</span><div id="minute-wheel" class="wheel" role="listbox" aria-label="Минуты" tabindex="0"></div></div><button id="save-hours" class="save-hours" aria-label="Сохранить рабочие часы">✓</button></section></div>
<div id="toast" class="toast" role="status"></div><script type="module" src="./app.mjs?v=3.6.0"></script></body></html>
