<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>REDLINE</title><link rel="preload" href="./redline-hand.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="./style.css?v=5.1.0"></head>
<body><main id="main-page" class="app"><header class="home-header"><button id="settings" class="icon-button" aria-label="Настройки приложения"></button><div class="home-date"><time id="today"></time><button id="habit-badge" class="habit-badge" aria-label="Открыть напоминания" hidden></button></div><button id="stats" class="icon-button" aria-label="Статистика и достижения"></button></header><time id="wall-clock" class="wall-clock"></time><button id="hours" hidden aria-label="Настроить рабочие часы"></button><div class="dial-stage"><div class="single-dial" id="single-dial"><svg id="main-dial-svg" viewBox="0 0 500 500" aria-label="Восьмёрка дня от 0 до 24 часов"></svg><button id="event-center" class="next-event-center" aria-label="Настроить события"><span id="next-event-icon" class="next-event-icon" aria-hidden="true"></span><span id="next-event-name"></span><strong id="next-event-time"></strong><small id="next-event-clock"></small></button><button id="work-readout" class="work-readout" aria-label="Настроить рабочий день"></button><div class="single-center"><div id="session-icon" class="session-icon" aria-hidden="true"></div><div id="now" class="now"></div><div id="label" class="label"></div><div class="live-time"><span id="exercise-bar-fill" class="exercise-bar-fill" aria-hidden="true"></span><span id="time" class="time"></span><small id="seconds"></small></div><div id="note" class="note"></div><svg id="session-progress" class="session-progress" viewBox="0 0 100 100" aria-hidden="true" hidden><circle class="session-track" cx="50" cy="50" r="47"/><circle class="session-fill" cx="50" cy="50" r="47" pathLength="100"/></svg></div></div></div><section class="task-dock" aria-label="Будущие задачи и отсчёты"><button id="custom-timer" class="dock-launch" aria-label="Выбрать таймер"></button><section id="event-selection" class="future-tasks" aria-label="Все будущие задачи" tabindex="0"></section><button id="custom-stopwatch" class="dock-launch" aria-label="Запустить секундомер"></button><div class="timer-strip" id="timer-strip" hidden></div></section><div class="home-controls"><div id="timer-controls" class="timer-controls" hidden><button id="minimize-session" class="round-control" aria-label="Свернуть отсчёт"><span>⌄</span></button><button id="stopwatch-pause" class="round-control" hidden aria-label="Пауза"><span>Ⅱ</span><small>Пауза</small></button><button id="stopwatch-reset" class="round-control" hidden aria-label="Сбросить секундомер"><span>↺</span><small>Сброс</small></button><button id="stopwatch-lap" class="round-control" hidden aria-label="Отметить круг"><span>⚑</span><small>Круг</small></button><button id="cancel" class="round-control" aria-label="Отменить таймер"><span>×</span></button><button id="finish" class="round-control" aria-label="Завершить таймер"><span>✓</span></button></div>
<div class="actions"><button id="pause" class="round-action" aria-label="Перерыв" title="Перерыв"></button><button id="workout" class="round-action" aria-label="Зарядка" title="Зарядка"></button><button id="walk" class="round-action" aria-label="Отойти" title="Отойти"></button></div>
</div><footer class="schedule-legend" aria-label="Настройка периодов дня"><button id="period-work"><i class="legend-swatch work-swatch" aria-hidden="true"></i><span>Работа<small></small></span></button><button id="period-awake"><i class="legend-swatch awake-swatch" aria-hidden="true"></i><span>Бодрствование<small></small></span></button><button id="period-sleep"><i class="legend-swatch sleep-swatch" aria-hidden="true"></i><span>Сон<small></small></span></button></footer></main>
<section id="sound-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Звуки</h1><button id="save-sounds" class="icon-button" aria-label="Сохранить звуки">✓</button></header><div id="sound-form" class="settings-body"></div></section>
<section id="settings-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Настройки</h1><button id="save-settings" class="icon-button" aria-label="Сохранить настройки">✓</button></header><div class="settings-footer settings-top"><span class="brand">REDLINE / 5.1</span><button id="reload" class="icon-button" aria-label="Обновить приложение">↻</button></div><div class="settings-sound-row"><button id="sound-settings" class="sound-settings-link">Звуки</button><button id="sound" class="icon-button" aria-label="Настройки звуков"></button></div><div id="settings-form" class="settings-body"></div></section>
<section id="events-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="На главную">←</button><h1>Режимы</h1><button id="save-events" class="icon-button bare-check" aria-label="Сохранить события">✓</button></header><div id="events-form"></div><div id="events-ai-result" aria-live="polite"></div></section><section id="ai-page" class="app subpage" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>AI-помощник</h1><span></span></header><div id="ai-form"></div><div id="ai-result" aria-live="polite"></div></section><section id="stats-page" class="app stats-page" hidden><header><button class="icon-button page-back" aria-label="Назад">←</button><h1>Статистика</h1><span class="header-space"></span></header><div class="stats-fixed"><div class="stats-dates"><input id="stats-from" type="date" aria-label="Начало периода"><span>⟶<small id="stats-days"></small></span><input id="stats-to" type="date" aria-label="Конец периода"></div><div id="stats-periods" class="stats-periods"><button data-days="1">1</button><button data-days="7">7</button><button data-days="30">30</button><button data-days="365">365</button><button data-days="all" aria-label="Всё время">∞</button></div><div id="stats-chart" class="stats-chart" tabindex="0" role="group" aria-label="Перетащите график; два пальца меняют масштаб"><svg id="stats-svg" viewBox="0 0 600 180" preserveAspectRatio="none" aria-label="Время событий по дням" role="img"></svg><div id="stats-axis" class="stats-axis"></div></div><div id="stats-selection" class="stats-selection"></div></div><div id="achievement-summary" class="achievement-summary"></div><button id="stats-ai" class="settings-link">AI · Помочь с целью</button><div id="stats-list" class="stats-list" tabindex="0" role="region" aria-label="Журнал событий"></div></section><div id="break-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="break-title"><section class="sheet"><div class="sheet-heading"><h2 id="break-title">Перерыв</h2><button class="icon-button close" data-close aria-label="Закрыть">×</button></div><div id="reasons" class="reasons"></div></section></div>
<div id="hours-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="hours-title"><section class="sheet time-sheet"><div class="sheet-heading"><h2 id="hours-title">Рабочие часы</h2><button class="icon-button close" data-close aria-label="Отменить">×</button></div><p id="schedule-help" class="ai-note"></p><label id="schedule-enabled-row" class="setting-row" hidden><span>Использовать расписание сна</span><input id="schedule-enabled" type="checkbox"></label><div class="time-tabs"><button id="start-tab" aria-pressed="true"></button><button id="end-tab" aria-pressed="false"></button></div><div class="wheel-labels"><span>Часы</span><span>Минуты</span></div><div class="time-wheels"><div id="hour-wheel" class="wheel" role="listbox" aria-label="Часы" tabindex="0"></div><span class="colon">:</span><div id="minute-wheel" class="wheel" role="listbox" aria-label="Минуты" tabindex="0"></div></div><button id="save-hours" class="save-hours" aria-label="Сохранить рабочие часы">✓</button></section></div>
<div id="goal-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="goal-title"><section class="sheet goal-sheet"><div class="sheet-heading"><h2 id="goal-title">Таймер</h2><button class="icon-button" data-close aria-label="Отмена">×</button></div><p id="goal-help" class="ai-note"></p><div class="goal-edit-row"><div id="goal-selected" class="goal-selected"></div><button id="goal-custom-add" class="icon-button" aria-label="Своё время">＋</button></div><div class="goal-wheels" id="goal-wheels"><label><svg class="wheel-unit" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div id="goal-hours" class="wheel" tabindex="0" role="listbox" aria-label="Часы"></div></label><label><svg class="wheel-unit" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 3v9l-4 4"/></svg><div id="goal-minutes" class="wheel" tabindex="0" role="listbox" aria-label="Минуты"></div></label><label><svg class="wheel-unit" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 3v9M3 12h2M19 12h2"/></svg><div id="goal-seconds" class="wheel" tabindex="0" role="listbox" aria-label="Секунды"></div></label></div><label id="goal-option" class="setting-row"><span>Сигнал при достижении цели</span><input id="goal-enabled" type="checkbox"></label><div id="goal-presets" class="goal-presets"></div><div id="goal-saved-presets" class="goal-saved-presets"></div><div class="goal-footer"><button id="start-goal" class="icon-button bare-check" aria-label="Запустить таймер">✓</button></div></section></div><section id="habit-alert" class="habit-alert" role="alertdialog" aria-modal="true" aria-labelledby="habit-alert-title" hidden><div class="habit-alert-card"><small id="habit-alert-count"></small><h2 id="habit-alert-title"></h2><p id="habit-alert-time"></p><div id="habit-alert-picture"></div><p id="habit-alert-error" class="inline-error" role="status"></p><div class="habit-alert-actions"><button id="habit-start">Начать</button><button id="habit-done">Выполнено</button><button id="habit-snooze">Позже · 5 мин</button><button id="habit-cancel">Отменить</button><button id="habit-silence">Выключить звук</button></div></div></section><section id="session-overlay" class="session-overlay" role="dialog" aria-modal="true" aria-label="Текущий отсчёт" hidden><div id="session-center-host"></div><div id="exercise-guide" class="exercise-guide" hidden></div><div id="lap-readout" class="lap-readout"></div><div id="session-controls-host"></div></section><script type="module" src="./app.mjs?v=5.1.0"></script></body></html>
